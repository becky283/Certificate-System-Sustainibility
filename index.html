/* ── Tweaks ── */
function useTweaks(defaults) {
  const [v, setV] = useState(defaults);
  const set = useCallback((k, val) => {
    const e = typeof k==='object' ? k : {[k]:val};
    setV(p=>({...p,...e}));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:e},'*');
  },[]);
  return [v, set];
}
function TweaksPanel({children}) {
  const [open,setOpen]=useState(false);
  const ref=useRef(null); const off=useRef({x:16,y:16});
  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode') setOpen(true);
      if(e.data?.type==='__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',h);
  },[]);
  const dismiss=()=>{setOpen(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');};
  const drag=e=>{
    const r=ref.current.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY,sr=window.innerWidth-r.right,sb=window.innerHeight-r.bottom;
    const mv=ev=>{off.current={x:Math.max(8,sr-(ev.clientX-sx)),y:Math.max(8,sb-(ev.clientY-sy))};ref.current.style.right=off.current.x+'px';ref.current.style.bottom=off.current.y+'px';};
    const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
  };
  if(!open) return null;
  return <div ref={ref} className="twk-panel" style={{right:off.current.x,bottom:off.current.y}}><div className="twk-hd" onMouseDown={drag}><b>Tweaks</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div>;
}
function TweakSection({label,children}){return <><div className="twk-sect">{label}</div>{children}</>;}
function TweakColor({label,value,onChange}){return <div className="twk-row-h"><span className="twk-lbl">{label}</span><input type="color" className="twk-swatch" value={value} onChange={e=>onChange(e.target.value)}/></div>;}
function TweakToggle({label,value,onChange}){return <div className="twk-row-h"><span className="twk-lbl">{label}</span><button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={()=>onChange(!value)}><i/></button></div>;}

/* ── Shared UI ── */
function LiveDot({color='var(--green-acc)',size=8}){
  return <span style={{display:'inline-block',width:size,height:size,borderRadius:'50%',background:color,animation:'pulse-dot 2s ease-in-out infinite',flexShrink:0}}/>;

function Badge({text,color='var(--green-acc)',bg='var(--green-light)'}){
  return <span style={{background:bg,color,borderRadius:4,padding:'2px 8px',fontSize:11,fontFamily:'var(--font-mono)',fontWeight:600,letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{text}</span>;
}
function Card({children,style,onClick}){
  const [hov,setHov]=useState(false);
  return <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{background:'var(--bg-card)',border:`1.5px solid ${hov&&onClick?'var(--green-mid)':'var(--border)'}`,borderRadius:10,padding:'20px 24px',boxShadow:hov&&onClick?'var(--shadow-md)':'var(--shadow-sm)',transition:'all .18s',cursor:onClick?'pointer':'default',...style}}>{children}</div>;
}
function SectionLabel({text}){
  return <div style={{fontSize:10.5,fontFamily:'var(--font-mono)',color:'var(--text-3)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:6}}>{text}</div>;
}
function CarbonBar({value,max=120}){
  const pct=(value/max)*100;
  const color=pct<55?'var(--green-acc)':pct<75?'var(--amber)':'var(--red)';
  return <div><div style={{height:6,background:'var(--bg-section)',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:3,transition:'width .6s'}}/></div><div style={{fontSize:11,color,fontFamily:'var(--font-mono)',marginTop:3}}>{value} kg CO₂e/t Ni</div></div>;

/* ── Dashboard ── */
function StatCard({label,value,unit,delta,color,delay=0}){
  const [disp,setDisp]=useState('0');
  useEffect(()=>{const t=setTimeout(()=>setDisp(value),delay);return()=>clearTimeout(t);},[value,delay]);
  const pos=delta.startsWith('+');
  return (
    <Card style={{animation:`fadeInUp .45s ease ${delay}ms both`}}>
      <SectionLabel text={label}/>
      <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:6}}>
        <span style={{fontSize:34,fontWeight:800,color,lineHeight:1,fontVariantNumeric:'tabular-nums'}}>{disp}</span>

      </div>
      <div style={{fontSize:12,color:pos?'var(--green-acc)':'var(--red)',fontFamily:'var(--font-mono)',display:'flex',alignItems:'center',gap:4}}>
        <span>{pos?'▲':'▼'}</span><span>{delta} vs tahun lalu</span>
      </div>
    </Card>
  );
}

    <div style={{display:'flex',gap:24,alignItems:'center'}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--bg-section)" strokeWidth={16}/>

/* ── TREND VIEW ── */
function TrendView(){
  const [activeLines, setActiveLines] = useState(Object.keys(TREND_DATA));
  const [hoveredPoint, setHoveredPoint] = useState(null);

  const W=700, H=320, PAD={top:24,right:24,bottom:48,left:56};
  const plotW=W-PAD.left-PAD.right;
  const plotH=H-PAD.top-PAD.bottom;
  const minV=30, maxV=150;

  const xScale = i => PAD.left + (i/(TREND_MONTHS.length-1))*plotW;
  const yScale = v => PAD.top + plotH - ((v-minV)/(maxV-minV))*plotH;

  const linePoints = (key) => TREND_DATA[key].map((v,i)=>`${xScale(i)},${yScale(v)}`).join(' ');

  const toggle = key => setActiveLines(prev => prev.includes(key) ? prev.filter(k=>k!==key) : [...prev,key]);

  return (
    <div style={{padding:'32px 32px 48px',maxWidth:1200,margin:'0 auto',width:'100%'}}>
      <div style={{marginBottom:28}}>
        <SectionLabel text="Modul — Tren & Analisis"/>
        <h2 style={{fontSize:24,fontWeight:800}}>Tren Intensitas Karbon IGNS</h2>
        <p style={{color:'var(--text-2)',fontSize:13.5,marginTop:6,maxWidth:600,lineHeight:1.65}}>Perbandingan intensitas emisi CO₂ produk berdasarkan grade sertifikasi dari waktu ke waktu, dibandingkan dengan rerata global. Data diperbarui setiap kuartal berdasarkan laporan auditor.</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:24,alignItems:'start'}}>
        {/* Chart */}
        <Card style={{padding:'24px 20px 16px',overflow:'hidden',position:'relative'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div style={{fontWeight:700,fontSize:15}}>Intensitas CO₂ per Grade (2024–2025)</div>
            <div style={{fontSize:11,color:'var(--text-3)',fontFamily:'var(--font-mono)'}}>kg CO₂e / ton Ni</div>
          </div>

          {/* Legend toggle */}
          <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
            {Object.keys(TREND_DATA).map(key=>(
              <button key={key} onClick={()=>toggle(key)} style={{display:'flex',alignItems:'center',gap:6,background:activeLines.includes(key)?TREND_COLORS[key]+'18':'var(--bg-section)',border:`1.5px solid ${activeLines.includes(key)?TREND_COLORS[key]:'var(--border)'}`,borderRadius:20,padding:'4px 12px',cursor:'pointer',fontSize:12,fontWeight:600,color:activeLines.includes(key)?TREND_COLORS[key]:'var(--text-3)',transition:'all .15s'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:activeLines.includes(key)?TREND_COLORS[key]:'var(--border)'}}/>
                {key==='Global'?'Rerata Global':`Grade ${key}`}
              </button>
            ))}
          </div>

          <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
            {/* Grid lines */}
            {[50,75,100,125].map(v=>(
              <g key={v}>
                <line x1={PAD.left} y1={yScale(v)} x2={PAD.left+plotW} y2={yScale(v)} stroke="var(--border)" strokeWidth="1" strokeDasharray="4 4"/>
                <text x={PAD.left-8} y={yScale(v)+4} textAnchor="end" fontSize="11" fill="var(--text-3)" fontFamily="'DM Mono',monospace">{v}</text>
              </g>
            ))}

            {/* X axis labels */}
            {TREND_MONTHS.map((m,i)=>(
              <text key={m} x={xScale(i)} y={H-PAD.bottom+18} textAnchor="middle" fontSize="11" fill="var(--text-3)" fontFamily="'DM Mono',monospace">{m}</text>
            ))}

            {/* Threshold line */}
            <line x1={PAD.left} y1={yScale(100)} x2={PAD.left+plotW} y2={yScale(100)} stroke="var(--red)" strokeWidth="1" strokeDasharray="6 3" opacity=".5"/>
            <text x={PAD.left+plotW+4} y={yScale(100)+4} fontSize="10" fill="var(--red)" fontFamily="'DM Mono',monospace" opacity=".7">Batas</text>

            {/* Lines + dots */}
            {Object.keys(TREND_DATA).filter(k=>activeLines.includes(k)).map(key=>(
              <g key={key}>
                {/* Area fill */}
                <polygon
                  points={[
                    `${PAD.left},${PAD.top+plotH}`,
                    ...TREND_DATA[key].map((v,i)=>`${xScale(i)},${yScale(v)}`),
                    `${PAD.left+plotW},${PAD.top+plotH}`
                  ].join(' ')}
                  fill={TREND_COLORS[key]} opacity="0.07"
                />
                {/* Line */}
                <polyline points={linePoints(key)} fill="none" stroke={TREND_COLORS[key]} strokeWidth={key==='Global'?1.5:2.5} strokeLinejoin="round" strokeLinecap="round" strokeDasharray={key==='Global'?'5 3':undefined}/>
                {/* Data points */}
                {TREND_DATA[key].map((v,i)=>(
                  <circle key={i} cx={xScale(i)} cy={yScale(v)} r={hoveredPoint?.key===key&&hoveredPoint?.i===i?6:4}
                    fill="#fff" stroke={TREND_COLORS[key]} strokeWidth="2.5"
                    style={{cursor:'pointer',transition:'r .15s'}}
                    onMouseEnter={()=>setHoveredPoint({key,i,v,x:xScale(i),y:yScale(v)})}
                    onMouseLeave={()=>setHoveredPoint(null)}
                  />
                ))}
              </g>
            ))}

            {/* Axes */}
            <line x1={PAD.left} y1={PAD.top} x2={PAD.left} y2={PAD.top+plotH} stroke="var(--border-mid)" strokeWidth="1.5"/>
            <line x1={PAD.left} y1={PAD.top+plotH} x2={PAD.left+plotW} y2={PAD.top+plotH} stroke="var(--border-mid)" strokeWidth="1.5"/>
          </svg>

          {/* Hover tooltip */}
          {hoveredPoint&&(
            <div style={{position:'absolute',left:hoveredPoint.x/W*100+'%',top:(hoveredPoint.y/H*100)+'%',transform:'translate(-50%,-120%)',background:'#fff',border:'1.5px solid var(--border-mid)',borderRadius:8,padding:'8px 12px',fontSize:12,boxShadow:'var(--shadow-md)',pointerEvents:'none',whiteSpace:'nowrap',zIndex:10}}>
              <div style={{fontWeight:700,color:TREND_COLORS[hoveredPoint.key],marginBottom:2}}>{hoveredPoint.key==='Global'?'Rerata Global':`Grade ${hoveredPoint.key}`}</div>
              <div style={{color:'var(--text-1)',fontFamily:'var(--font-mono)',fontWeight:600}}>{hoveredPoint.v} kg CO₂e/t Ni</div>
              <div style={{color:'var(--text-3)',fontSize:11}}>{TREND_MONTHS[hoveredPoint.i]}</div>
            </div>
          )}
        </Card>

        {/* Side stats */}
        <div style={{display:'flex',flexDirection:'column',gap:14,minWidth:200}}>
          <Card>
            <SectionLabel text="Penurunan CO₂ (YoY)"/>
            <div style={{fontSize:32,fontWeight:800,color:'var(--green-acc)',lineHeight:1}}>−12%</div>
            <div style={{fontSize:12,color:'var(--text-2)',marginTop:4}}>Grade A+ (Jan 24 → Mar 25)</div>
          </Card>
          <Card>
            <SectionLabel text="Gap vs. Global"/>
            <div style={{fontSize:32,fontWeight:800,color:'var(--sky)',lineHeight:1}}>−72 kg</div>
            <div style={{fontSize:12,color:'var(--text-2)',marginTop:4}}>A+ vs. Rerata Global</div>
          </Card>
          <Card>
            <SectionLabel text="Target 2030"/>
            <div style={{fontSize:32,fontWeight:800,color:'var(--gold)',lineHeight:1}}>45 kg</div>
            <div style={{fontSize:12,color:'var(--text-2)',marginTop:4}}>CO₂e/t Ni (net-zero path)</div>
          </Card>
          <Card style={{background:'var(--green-pale)',borderColor:'var(--border-mid)'}}>
            <div style={{fontSize:12,color:'var(--green-dark)',lineHeight:1.6}}>
              Tren menunjukkan konsistensi penurunan emisi di semua grade, didorong oleh peningkatan porsi energi terbarukan dan efisiensi proses smelting.
            </div>
          </Card>
        </div>
      </div>

      {/* Monthly breakdown table */}
      <Card style={{marginTop:20}}>
        <SectionLabel text="Rincian Bulanan — Intensitas CO₂ (kg CO₂e/t Ni)"/>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
            <thead>
              <tr style={{borderBottom:'1.5px solid var(--border)'}}>
                <th style={{padding:'10px 16px',textAlign:'left',fontWeight:600,color:'var(--text-2)',fontSize:12}}>Grade</th>
                {TREND_MONTHS.map(m=>(
                  <th key={m} style={{padding:'10px 12px',textAlign:'center',fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-3)',fontWeight:500}}>{m}</th>
                ))}
                <th style={{padding:'10px 12px',textAlign:'center',fontSize:12,color:'var(--text-2)',fontWeight:600}}>Perubahan</th>
              </tr>
            </thead>
            <tbody>
              {Object.entries(TREND_DATA).map(([key,vals])=>{
                const change=vals[vals.length-1]-vals[0];
                return (
                  <tr key={key} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'10px 16px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:10,height:10,borderRadius:'50%',background:TREND_COLORS[key]}}/>
                        <span style={{fontWeight:700,color:TREND_COLORS[key]}}>{key==='Global'?'Rerata Global':`Grade ${key}`}</span>
                      </div>
                    </td>
                    {vals.map((v,i)=>(
                      <td key={i} style={{padding:'10px 12px',textAlign:'center',fontFamily:'var(--font-mono)',fontSize:12,color:v<75?'var(--green-acc)':v<100?'var(--amber)':'var(--red)',fontWeight:600}}>{v}</td>
                    ))}
                    <td style={{padding:'10px 12px',textAlign:'center',fontFamily:'var(--font-mono)',fontSize:12,color:change<0?'var(--green-acc)':'var(--red)',fontWeight:700}}>{change>0?'+':''}{change}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ── MAP VIEW ── */
function MapView(){
  const [selected,setSelected]=useState(null);
  const [filter,setFilter]=useState('all');
  const [tooltip,setTooltip]=useState(null);

  const filtered = filter==='all' ? MAP_LOCATIONS : MAP_LOCATIONS.filter(l=>l.type===filter);

  return (
    <div style={{padding:'32px 32px 48px',maxWidth:1200,margin:'0 auto',width:'100%'}}>
      <div style={{marginBottom:24}}>
        <SectionLabel text="Modul — Peta Sebaran"/>
        <h2 style={{fontSize:24,fontWeight:800}}>Sebaran Fasilitas Nikel Indonesia</h2>
        <p style={{color:'var(--text-2)',fontSize:13.5,marginTop:6,maxWidth:600,lineHeight:1.65}}>Distribusi geografis tambang, smelter, refinery, dan fasilitas produksi prekursor NMC yang terdaftar dalam sistem sertifikasi IGNS.</p>
      </div>

      {/* Filter */}
      <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
        {['all','mine','smelter','refinery','precursor'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{display:'flex',alignItems:'center',gap:6,background:filter===f?(f==='all'?'var(--green-pale)':TYPE_COLORS[f]+'18'):'#fff',border:`1.5px solid ${filter===f?(f==='all'?'var(--green-mid)':TYPE_COLORS[f]):'var(--border)'}`,color:filter===f?(f==='all'?'var(--green-dark)':TYPE_COLORS[f]):'var(--text-2)',borderRadius:8,padding:'6px 14px',cursor:'pointer',fontSize:12.5,fontWeight:filter===f?700:400,fontFamily:'var(--font-body)',transition:'all .14s'}}>
            {f!=='all'&&<div style={{width:8,height:8,borderRadius:'50%',background:filter===f?TYPE_COLORS[f]:'var(--border)'}}/>}
            {f==='all'?'Semua Fasilitas':TYPE_LABELS[f]}
          </button>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:20,alignItems:'start'}}>
        {/* Map with real PNG background */}
        <Card style={{padding:16,overflow:'hidden',position:'relative'}}>
          {/* Map container — preserves 700:350 = 2:1 aspect ratio */}
          <div style={{position:'relative',width:'100%',paddingBottom:'50%',background:'#dbeafe',borderRadius:8,overflow:'hidden'}}>
            {/* Map background: ocean + island PNG as CSS bg so coordinates are exact */}
            <div style={{
              position:'absolute', inset:0,
              background:'linear-gradient(160deg,#c8e6f8 0%,#dbeafe 100%)',
            }}/>
            {/* Island silhouette tinted green via CSS filter */}
            <div style={{
              position:'absolute', inset:0,
              backgroundImage:'url("indonesia-map.png")',
              backgroundSize:'100% 100%',
              backgroundRepeat:'no-repeat',
              backgroundPosition:'center',
              filter:'invert(1) sepia(1) saturate(2) hue-rotate(88deg) brightness(.78)',
              opacity:.92,
            }}/>

            {/* SVG overlay — viewBox 200×100 matches 2:1 container exactly */}
            <svg
              viewBox="0 0 200 100"
              style={{position:'absolute',inset:0,width:'100%',height:'100%'}}
              preserveAspectRatio="none"
            >
              {filtered.map(loc => {
                const isSelected = selected?.id === loc.id;
                const color = TYPE_COLORS[loc.type];
                const vx = loc.x;
                const vy = loc.y;
                return (
                  <g key={loc.id} style={{cursor:'pointer'}}
                    onClick={() => setSelected(selected?.id===loc.id ? null : loc)}
                    onMouseEnter={() => setTooltip(loc)}
                    onMouseLeave={() => setTooltip(null)}
                  >
                    {/* Outer ring when selected */}
                    {isSelected && <circle cx={vx} cy={vy} r="4" fill={color} opacity=".18"/>}
                    {/* Shadow */}
                    <circle cx={vx} cy={vy+.4} r={isSelected?2.8:2.2} fill="rgba(0,0,0,.2)"/>
                    {/* Main dot */}
                    <circle cx={vx} cy={vy} r={isSelected?2.8:2.2} fill={color} stroke="#fff" strokeWidth="1"/>
                    {/* Inner white dot */}
                    <circle cx={vx} cy={vy} r=".8" fill="#fff" opacity=".9"/>
                    {/* Grade label when selected */}
                    {isSelected && (
                      <text x={vx} y={vy-4} textAnchor="middle" fontSize="3.5" fill={color} fontWeight="700" fontFamily="'Plus Jakarta Sans',sans-serif"
                        style={{filter:'drop-shadow(0 1px 2px #fff)'}}>
                        {loc.grade}
                      </text>
                    )}
                  </g>
                );
              })}
            </svg>

            {/* Hover tooltip */}
            {tooltip && (
              <div style={{
                position:'absolute', bottom:12, left:'50%', transform:'translateX(-50%)',
                background:'#fff', border:'1.5px solid var(--border-mid)',
                borderRadius:10, padding:'10px 14px', boxShadow:'var(--shadow-md)',
                minWidth:200, pointerEvents:'none', animation:'fadeInUp .15s ease both', zIndex:5,
              }}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                  <div style={{width:10,height:10,borderRadius:'50%',background:TYPE_COLORS[tooltip.type],flexShrink:0}}/>
                  <div style={{fontWeight:700,fontSize:13}}>{tooltip.name}</div>
                </div>
                <div style={{fontSize:12,color:'var(--text-2)',marginBottom:6}}>{tooltip.region}</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <Badge text={TYPE_LABELS[tooltip.type]} color={TYPE_COLORS[tooltip.type]} bg={TYPE_COLORS[tooltip.type]+'18'}/>
                  <Badge text={`Grade ${tooltip.grade}`} color={tooltip.grade.startsWith('A')?'var(--green-dark)':'var(--amber)'} bg={tooltip.grade.startsWith('A')?'var(--green-light)':'var(--gold-light)'}/>
                  <Badge text={`${tooltip.co2} kg CO₂`} color="var(--sky)" bg="var(--sky-light)"/>
                </div>
              </div>
            )}

            {/* Legend overlay */}
            <div style={{position:'absolute',top:10,left:10,background:'rgba(255,255,255,.88)',backdropFilter:'blur(6px)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',display:'flex',flexDirection:'column',gap:5}}>
              {Object.entries(TYPE_LABELS).map(([type,label])=>(
                <div key={type} style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:TYPE_COLORS[type],flexShrink:0}}/>
                  <span style={{fontSize:11,color:'var(--text-2)',fontWeight:500}}>{label}</span>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Location list */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>
            {filtered.length} Fasilitas {filter!=='all'?TYPE_LABELS[filter]:'Terdaftar'}
          </div>
          {filtered.map(loc=>(
            <div key={loc.id} onClick={()=>setSelected(selected?.id===loc.id?null:loc)}
              style={{background:selected?.id===loc.id?'var(--green-pale)':'#fff',border:`1.5px solid ${selected?.id===loc.id?'var(--green-mid)':'var(--border)'}`,borderRadius:10,padding:'12px 14px',cursor:'pointer',transition:'all .15s',boxShadow:selected?.id===loc.id?'var(--shadow-md)':'var(--shadow-sm)'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:6}}>
                <div>
                  <div style={{fontWeight:700,fontSize:13,lineHeight:1.3}}>{loc.name}</div>
                  <div style={{fontSize:11.5,color:'var(--text-2)',marginTop:2}}>{loc.region}</div>
                </div>
                <Badge text={`Grade ${loc.grade}`} color={loc.grade.startsWith('A')?'var(--green-dark)':'var(--amber)'} bg={loc.grade.startsWith('A')?'var(--green-light)':'var(--gold-light)'}/>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{display:'flex',alignItems:'center',gap:5}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:TYPE_COLORS[loc.type]}}/>
                  <span style={{fontSize:11.5,color:'var(--text-2)'}}>{TYPE_LABELS[loc.type]}</span>
                </div>
                <div style={{flex:1,height:4,background:'var(--bg-section)',borderRadius:2}}>
                  <div style={{width:`${(loc.co2/150)*100}%`,height:'100%',background:loc.co2<70?'var(--green-acc)':loc.co2<100?'var(--amber)':'var(--red)',borderRadius:2}}/>
                </div>
                <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:loc.co2<70?'var(--green-acc)':loc.co2<100?'var(--amber)':'var(--red)',fontWeight:600,whiteSpace:'nowrap'}}>{loc.co2} kg</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Root ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#16a34a",
  "showPremiumBanner": true
}/*EDITMODE-END*/;

function App(){
  const [activeTab,setActiveTab]=useState('dashboard');
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  useEffect(()=>{document.documentElement.style.setProperty('--green-acc',t.accentColor);},[t.accentColor]);
  return (
    <>
      <Header activeTab={activeTab} setActiveTab={setActiveTab}/>
      <main style={{flex:1}}>
        {activeTab==='dashboard'    && <DashboardView/>}
        {activeTab==='supplychain'  && <SupplyChainView/>}
        {activeTab==='certificates' && <CertificatesView/>}
        {activeTab==='tren'         && <TrendView/>}
        {activeTab==='peta'         && <MapView/>}
      </main>
      <footer style={{borderTop:'1.5px solid var(--border)',padding:'14px 32px',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:11.5,color:'var(--text-3)',background:'#fff'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <img src="kemenperin-logo.png" alt="Kemenperin" style={{height:22,opacity:.65}}/>
          <span>© 2025 IGNS — Indonesia Green Nickel Standard · Kemenperin × KLHK × BSN</span>
        </div>
        <div style={{display:'flex',gap:16,fontFamily:'var(--font-mono)',fontSize:11}}>
          <span>v2.2.0</span>
          <span style={{color:'var(--green-acc)',display:'flex',alignItems:'center',gap:5}}><LiveDot size={6}/> Sistem Operasional</span>
        </div>
      </footer>
      <TweaksPanel>
        <TweakSection label="Tampilan">
          <TweakColor  label="Warna Aksen"             value={t.accentColor}       onChange={v=>setTweak('accentColor',v)}/>
          <TweakToggle label="Tampilkan Banner Premium" value={t.showPremiumBanner} onChange={v=>setTweak('showPremiumBanner',v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
